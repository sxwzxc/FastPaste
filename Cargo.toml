[package]
name = "fastpaste"
version = "0.2.4"
edition = "2021"
description = "跨平台静默剪贴板管理器 - 常驻托盘、监听剪贴板、全局热键粘贴最近10条"
license = "MIT"
repository = "https://github.com/sxwzxc/FastPaste"
keywords = ["clipboard", "tray", "hotkey", "productivity"]
authors = ["FastPaste Team"]
rust-version = "1.70"

[[bin]]
name = "fastpaste"
path = "src/main.rs"

[dependencies]
arboard = "3.4"
enigo = { version = "0.2", features = [] }
tray-icon = "0.19"
global-hotkey = "0.6"
muda = "0.15"
winit = "0.29"
dirs = "5.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
parking_lot = "0.12"
single-instance = "0.3"
is_elevated = "0.1"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.56", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"