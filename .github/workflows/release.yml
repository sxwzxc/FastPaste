name: Release

# 一键打包 (Windows + macOS) + 自动发布到 GitHub Release
# 对应本地 release.ps1 / release.bat 的 CI 版本
# 触发:
#  1) 手动 workflow_dispatch 输入版本号 x.y.z (推荐) -> bump -> 构建双平台 -> 提交推送 -> 发布 Release
#  2) 推送 tag v*.*.* -> 直接构建双平台 -> 发布 Release (不改版本文件)
#  3) 推送到 main (自动) -> 构建双平台 -> 自动发布 Release (以 Cargo.toml 版本为准，无需手动打 tag)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "新版本号 x.y.z，例如 0.2.5 (留空则保持 Cargo.toml 当前版本)"
        required: false
        default: ""
        type: string
      skip_test:
        description: "跳过 cargo test"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: [v*.*.*]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "app.manifest"
      - "src/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 1) 确定版本号 (单点输出，供后续 jobs 复用)
  # ------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.version.outputs.target_version }}
      current_version: ${{ steps.version.outputs.current_version }}
      is_bump: ${{ steps.version.outputs.is_bump }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-CurrentVersion {
            $toml = Get-Content -LiteralPath "Cargo.toml" -Raw -Encoding UTF8
            if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "无法从 Cargo.toml 解析 version" }
            return $Matches[1].Trim()
          }
          $CurrentVersion = Get-CurrentVersion
          Write-Host "CurrentVersion = $CurrentVersion"
          $TargetVersion = ""
          $EventName = "${{ github.event_name }}"
          $RefName = "${{ github.ref_name }}"
          $RefType = "${{ github.ref_type }}"
          $InputVersion = "${{ inputs.version }}".Trim()
          if ($EventName -eq "workflow_dispatch") {
            if ([string]::IsNullOrWhiteSpace($InputVersion)) {
              $TargetVersion = $CurrentVersion
              Write-Host "workflow_dispatch 未输入版本，保持 $TargetVersion"
            } else { $TargetVersion = $InputVersion }
          } elseif ($RefType -eq "tag") {
            $TargetVersion = $RefName.TrimStart("v").Trim()
            Write-Host "tag 触发: $RefName -> $TargetVersion"
          } else { $TargetVersion = $CurrentVersion }
          if ($TargetVersion -notmatch '^\d+\.\d+\.\d+$') { throw "版本号格式非法: '$TargetVersion'" }
          $IsBump = ($TargetVersion -ne $CurrentVersion)
          Write-Host "TargetVersion=$TargetVersion IsBump=$IsBump"
          "current_version=$CurrentVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_version=$TargetVersion"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_bump=$IsBump"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check should publish
        id: check
        shell: bash
        run: |
          set -e
          TARGET="${{ steps.version.outputs.target_version }}"
          EVENT="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"
          echo "EVENT=$EVENT REF_TYPE=$REF_TYPE TARGET=$TARGET"
          # 所有触发均发布：workflow_dispatch/tag 必发；push 到 main 也自动发布（已通过 paths 过滤，仅相关变更触发）
          # 去重后的 dist/* 单次上传避免重复，此处始终为 true，后续可在 TAG 已存在时按需跳过或覆盖
          echo "should_publish=true" >> $GITHUB_OUTPUT
          echo "will publish v$TARGET"

  # ------------------------------------------------------------
  # 2) 双平台编译 (Windows + macOS)
  # 仅当需要发布时才编译，节省资源并避免重复 Release 覆盖
  # ------------------------------------------------------------
  build:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Bump version for build (ensure binary embeds correct version)
        if: needs.prepare.outputs.is_bump == 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TargetVersion = "${{ needs.prepare.outputs.target_version }}"
          Write-Host "Bump (build) -> $TargetVersion"
          $lines = Get-Content -LiteralPath "Cargo.toml" -Encoding UTF8
          $inPackage = $false; $replaced = $false
          for ($i=0; $i -lt $lines.Count; $i++) {
            $trim = $lines[$i].Trim()
            if ($trim -match '^\[package\]') { $inPackage = $true; continue }
            if ($inPackage -and $trim -match '^\[') { $inPackage = $false }
            if ($inPackage -and -not $replaced -and $lines[$i] -match '^\s*version\s*=\s*".*?"') {
              $lines[$i] = $lines[$i] -replace 'version\s*=\s*".*?"', "version = `"$TargetVersion`""
              $replaced = $true; break
            }
          }
          if (-not $replaced) {
            $raw = Get-Content -LiteralPath "Cargo.toml" -Raw -Encoding UTF8
            $raw = $raw -replace 'version\s*=\s*".*?"', "version = `"$TargetVersion`"", 1
            [System.IO.File]::WriteAllText((Join-Path $PWD "Cargo.toml"), $raw, (New-Object System.Text.UTF8Encoding $false))
          } else {
            [System.IO.File]::WriteAllText((Join-Path $PWD "Cargo.toml"), ($lines -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          }
          $manifestPath = "app.manifest"
          if (Test-Path -LiteralPath $manifestPath) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8
            $manifestVer4 = "$TargetVersion.0"
            if ($manifest -match 'assemblyIdentity[^>]*version="[^"]+"') {
              $manifest = $manifest -replace '(assemblyIdentity[^>]*version=")[^"]+(")', "`${1}$manifestVer4`$2"
              [System.IO.File]::WriteAllText((Join-Path $PWD $manifestPath), $manifest, (New-Object System.Text.UTF8Encoding $false))
            }
          }
          Write-Host "[OK] bumped to $TargetVersion"

      - name: cargo test
        if: ${{ !inputs.skip_test }}
        run: cargo test --verbose

      - name: cargo build --release
        run: cargo build --release --verbose

      - name: Generate dist artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TargetVersion = "${{ needs.prepare.outputs.target_version }}"
          $isWin = $env:RUNNER_OS -eq "Windows"
          $exeName = if ($isWin) { "fastpaste.exe" } else { "fastpaste" }
          $srcExe = "target/release/$exeName"
          if (-not (Test-Path -LiteralPath $srcExe)) {
            # fallback: try opposite name
            $alt = if ($isWin) { "target/release/fastpaste" } else { "target/release/fastpaste.exe" }
            if (Test-Path -LiteralPath $alt) { $srcExe = $alt; $exeName = Split-Path $alt -Leaf }
          }
          if (-not (Test-Path -LiteralPath $srcExe)) { throw "未找到产物 $srcExe" }
          $distDir = "dist"
          if (-not (Test-Path -LiteralPath $distDir)) { New-Item -ItemType Directory -Path $distDir | Out-Null }
          $dstExe = Join-Path $distDir $exeName
          Copy-Item -LiteralPath $srcExe -Destination $dstExe -Force
          $sizeMB = "{0:N2}" -f ((Get-Item -LiteralPath $dstExe).Length / 1MB)
          Write-Host "[OK] $srcExe -> $dstExe ($sizeMB MB)"
          $hash = (Get-FileHash -LiteralPath $dstExe -Algorithm SHA256).Hash.ToLower()
          $shaFile = "$dstExe.sha256"
          [System.IO.File]::WriteAllText($shaFile, "$hash  $exeName", (New-Object System.Text.UTF8Encoding $false))
          Write-Host "[OK] sha256: $hash  $exeName"
          # 平台后缀
          $platform = if ($isWin) { "windows-x64" } else { "macos-arm64" }
          if ($env:RUNNER_OS -eq "macOS" -and $env:RUNNER_ARCH -eq "X64") { $platform = "macos-x64" }
          # macos-latest 当前为 arm64, 标记为 macos-arm64；如需 x64 可额外加 macos-13 任务
          $zipName = "fastpaste-v$TargetVersion-$platform.zip"
          $zipPath = Join-Path $distDir $zipName
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -LiteralPath $dstExe, $shaFile -DestinationPath $zipPath -Force
          Write-Host "[OK] zip: $zipPath"
          Get-ChildItem -LiteralPath $distDir | Format-Table Name, Length, LastWriteTime -AutoSize | Out-String | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastpaste-${{ matrix.os }}-${{ needs.prepare.outputs.target_version }}
          path: |
            dist/fastpaste*
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------
  # 3) 提交推送 + 发布 Release (自动)
  # ------------------------------------------------------------
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should_publish == 'true' && (always() && needs.build.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump + Update docs (for commit)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TargetVersion = "${{ needs.prepare.outputs.target_version }}"
          $CurrentVersion = "${{ needs.prepare.outputs.current_version }}"
          $IsBump = "${{ needs.prepare.outputs.is_bump }}"
          Write-Host "Target=$TargetVersion Current=$CurrentVersion IsBump=$IsBump"

          # 1) Bump Cargo.toml / app.manifest (幂等)
          if ($IsBump -eq "True") {
            $lines = Get-Content -LiteralPath "Cargo.toml" -Encoding UTF8
            $inPackage = $false; $replaced = $false
            for ($i=0; $i -lt $lines.Count; $i++) {
              $trim = $lines[$i].Trim()
              if ($trim -match '^\[package\]') { $inPackage = $true; continue }
              if ($inPackage -and $trim -match '^\[') { $inPackage = $false }
              if ($inPackage -and -not $replaced -and $lines[$i] -match '^\s*version\s*=\s*".*?"') {
                $lines[$i] = $lines[$i] -replace 'version\s*=\s*".*?"', "version = `"$TargetVersion`""
                $replaced = $true; break
              }
            }
            if (-not $replaced) {
              $raw = Get-Content -LiteralPath "Cargo.toml" -Raw -Encoding UTF8
              $raw = $raw -replace 'version\s*=\s*".*?"', "version = `"$TargetVersion`"", 1
              [System.IO.File]::WriteAllText((Join-Path $PWD "Cargo.toml"), $raw, (New-Object System.Text.UTF8Encoding $false))
            } else {
              [System.IO.File]::WriteAllText((Join-Path $PWD "Cargo.toml"), ($lines -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
            }
            $manifestPath = "app.manifest"
            if (Test-Path -LiteralPath $manifestPath) {
              $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8
              $manifestVer4 = "$TargetVersion.0"
              if ($manifest -match 'assemblyIdentity[^>]*version="[^"]+"') {
                $manifest = $manifest -replace '(assemblyIdentity[^>]*version=")[^"]+(")', "`${1}$manifestVer4`$2"
                [System.IO.File]::WriteAllText((Join-Path $PWD $manifestPath), $manifest, (New-Object System.Text.UTF8Encoding $false))
              }
            }
            Write-Host "[OK] bumped"
          }

          # 2) README release-info
          $buildTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $commitHash = "unknown"
          try { $commitHash = (git rev-parse --short HEAD 2>$null).Trim(); if (-not $commitHash) { $commitHash="unknown" } } catch {}
          $readmePath = "README.md"
          if (Test-Path -LiteralPath $readmePath) {
            $readme = Get-Content -LiteralPath $readmePath -Raw -Encoding UTF8
            $newInfo = "<!-- release-info:start -->`r`n> **当前版本**: ``v$TargetVersion`` | **构建时间**: $buildTime | **Commit**: ``$commitHash```r`n<!-- release-info:end -->"
            if ($readme -match '<!-- release-info:start -->[\s\S]*?<!-- release-info:end -->') {
              $readme = $readme -replace '<!-- release-info:start -->[\s\S]*?<!-- release-info:end -->', $newInfo
              [System.IO.File]::WriteAllText((Join-Path $PWD $readmePath), $readme, (New-Object System.Text.UTF8Encoding $false))
              Write-Host "[OK] README updated"
            }
          }
          # 3) CHANGELOG
          $changelogPath = "CHANGELOG.md"
          if (Test-Path -LiteralPath $changelogPath) {
            $changelog = Get-Content -LiteralPath $changelogPath -Raw -Encoding UTF8
            $today = Get-Date -Format "yyyy-MM-dd"
            if ($changelog -match "## \[$([regex]::Escape($TargetVersion))\]") {
              $escaped = [regex]::Escape($TargetVersion)
              $changelog = $changelog -replace "## \[$escaped\] - \d{4}-\d{2}-\d{2}", "## [$TargetVersion] - $today"
              [System.IO.File]::WriteAllText((Join-Path $PWD $changelogPath), $changelog, (New-Object System.Text.UTF8Encoding $false))
              Write-Host "[OK] CHANGELOG date -> $today"
            } elseif ($IsBump -eq "True") {
              $newEntry = "## [$TargetVersion] - $today`r`n`r`n### Changed`r`n- ...`r`n`r`n"
              if ($changelog -match '(?m)^## \[\d+\.\d+\.\d+\]') {
                $changelog = $changelog -replace '(?m)^(## \[\d+\.\d+\.\d+\])', "$newEntry`$1"
              } else { $changelog = $changelog.TrimEnd() + "`r`n`r`n" + $newEntry }
              [System.IO.File]::WriteAllText((Join-Path $PWD $changelogPath), $changelog, (New-Object System.Text.UTF8Encoding $false))
              Write-Host "[OK] CHANGELOG new entry"
            }
          }

      - name: Commit and push (only on workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TargetVersion = "${{ needs.prepare.outputs.target_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --porcelain
          $toAdd = @("Cargo.toml","app.manifest","README.md","CHANGELOG.md")
          $existing = $toAdd | Where-Object { Test-Path -LiteralPath $_ }
          git add -- $existing
          git diff --staged --quiet
          $hasStaged = ($LASTEXITCODE -ne 0)
          if ($hasStaged) {
            git commit -m "chore(release): v$TargetVersion [skip ci]"
            Write-Host "[OK] committed"
          } else { Write-Host "[SKIP] no staged changes" }
          $branch = "${{ github.ref_name }}"
          if (-not $branch) { $branch = "main" }
          Write-Host "push to $branch"
          git push origin HEAD:$branch
          $tag = "v$TargetVersion"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $remoteTag) {
            git tag $tag
            git push origin $tag
            Write-Host "[OK] pushed tag $tag"
          } else { Write-Host "[SKIP] remote tag $tag exists" }

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Consolidate artifacts (dedup)
        shell: bash
        run: |
          set -e
          echo "=== dist-all ==="
          ls -lhR dist-all || true
          mkdir -p dist
          # 清理旧 dist，避免重复
          rm -rf dist/*
          # 合并去重：所有平台产物已在 dist-all 中，直接复制一次
          cp -r dist-all/* dist/ 2>/dev/null || true
          echo "=== dist (consolidated) ==="
          ls -lh dist/
          # 去重校验
          echo "files to upload:"
          ls -1 dist/

      - name: Create GitHub Release (auto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.target_version }}
          name: FastPaste v${{ needs.prepare.outputs.target_version }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          # 仅从去重后的 dist 上传，避免 dist-all 重复
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
